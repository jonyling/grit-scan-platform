version: 1
# Draft. No code loads this file. See ontology-bind.md for its status.
#
# Each pattern ties one trigger to a label: a condition_id from config/urs-tw/URS-TW-Global-Baseline.json,
# or a theme_id from config/urs/URS-STE-Themes.json. The example titles come from 268 GRIT_Signals rows
# exported on 2026-10-01.
#
# Triggers, checked in this order:
#   keywords_any   A phrase in the title or body, case-insensitive. Each phrase has 6 or more characters or
#                  more than one word.
#   *_any fields   actors_any, rel_any, obj_any, places_any: a triple from GDELT or an accepted agent proposal.
#                  One hit in each listed field fires the pattern. Text rows, such as Brave or Currents
#                  results, cannot fire these triggers.
#   (neither)      The label theme's own keywords.
#
# require_ste_link: true means the pattern fires only on a page already linked to the STE register.
# Open question: with that rule, Trump-Xi coverage (about 51 of the 268 rows) stays unlinked.
patterns:
  # urs-tw: the ten standing conditions. condition_id is the baseline id.
  - id: US_CN_TECH_RIVALRY
    pack: [urs-tw]
    condition_id: TW-GLOBAL-06
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    actors_any: [US, PRC, TW]
    rel_any: [restricts_export_to, sanctions]
    obj_any: [semiconductors, lithography, dual_use_ai]
    exclude_rel: []
  - id: TW_PERSONNEL_DUTY_OF_CARE
    pack: [urs-tw]
    condition_id: TW-GLOBAL-03   # the closest condition; evacuation guidance is under TW-GLOBAL-10
    aperture: [DAILY, WEEKLY, RED]   # RED only if a named person approves it as pageable
    require_ste_link: true
    require_site_or_personnel: true
    actors_any: [PRC, PLA]
    rel_any: [military_action_toward]
    places_any: [TAIWAN]
  - id: TW_US_CN_COMPETITION
    pack: [urs-tw]
    condition_id: TW-GLOBAL-01
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    keywords_any: [US-China, Trump-Xi, trade truce, strategic competition]
  - id: TW_CHINA_TRAJECTORY
    pack: [urs-tw]
    condition_id: TW-GLOBAL-02
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    keywords_any: [Defense Mobilization, red-line, Taiwan-linked companies, civil-military]
  - id: TW_STRAIT_PRESSURE
    pack: [urs-tw]
    condition_id: TW-GLOBAL-03
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    keywords_any: [PLA aircraft, Coast Guard patrol, military exercise, blockade, sorties]
  - id: TW_US_ALLIANCE_POLICY
    pack: [urs-tw]
    condition_id: TW-GLOBAL-04
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    keywords_any: [arms sale, arms package, Taiwan policy, alliance posture]
  - id: TW_FED_BORROWING_COSTS
    pack: [urs-tw]
    condition_id: TW-GLOBAL-05
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    keywords_any: [Federal Reserve, Fed rate, rate hike, borrowing cost, forward guidance]
  - id: TW_SANCTIONS_EXPORT_CONTROLS
    pack: [urs-tw]
    condition_id: TW-GLOBAL-07
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    actors_any: [US, PRC, TW]
    rel_any: [sanctions, restricts_export_to]
  - id: TW_DOMESTIC_FINANCIAL_RESILIENCE
    pack: [urs-tw]
    condition_id: TW-GLOBAL-08
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    keywords_any: [Taiwan dollar, TWD weakens, payment delay, supplier liquidity, foreign investment]
  - id: TW_MIDEAST_RUSSIA_UKRAINE
    pack: [urs-tw]
    condition_id: TW-GLOBAL-09
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    keywords_any: [Middle East, Russia-Ukraine, Ukraine war, Moscow]
  - id: TW_INFRASTRUCTURE_RESILIENCE
    pack: [urs-tw]
    condition_id: TW-GLOBAL-10
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    keywords_any: [disaster prevention, radio security, spoofing, typhoon, earthquake, shelter guidance]

  # urs: the pack has no conditions, so each pattern points at a theme_id.
  - id: URS_COMPETITION
    pack: [urs]
    theme_id: URS-KEY-01
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
  - id: URS_FINANCIAL_VOLATILITY
    pack: [urs]
    theme_id: URS-KEY-02       # management request 3: USD/ILS for Israel, SGD/QAR for Qatar
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
  - id: URS_PROJECT_COST_MARGIN
    pack: [urs]
    theme_id: URS-KEY-03       # examples: "Tri-Rail $60M funding shortfall", rail labour strikes
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
  - id: URS_CYBER_INCIDENT
    pack: [urs]
    theme_id: URS-KEY-04       # examples: UK airports ransomware, rail SCADA directives, TETRA spoofing
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
  - id: URS_GEOPOLITICAL_OPERATIONS
    pack: [urs]
    theme_id: URS-KEY-05
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
  - id: URS_TECH_EXPORT_CONTROLS   # triple trigger; the urs counterpart of US_CN_TECH_RIVALRY
    pack: [urs]
    theme_id: URS-KEY-05
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    actors_any: [US, PRC, TW]
    rel_any: [restricts_export_to, sanctions]
    obj_any: [semiconductors, lithography, dual_use_ai]
  - id: URS_FRAUD_CORRUPTION
    pack: [urs]
    theme_id: URS-KEY-06       # sheet 7 lists no key issues, so no extra triggers
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
  - id: URS_NATURAL_DISASTER_PANDEMIC
    pack: [urs]
    theme_id: URS-TIER_2-02    # examples: Kumamoto earthquake rail restoration, heat-warped rails
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
  - id: URS_REGULATORY_COMPLIANCE
    pack: [urs]
    theme_id: URS-TIER_2-03    # examples: TSA rail cybersecurity directives, German locomotive approval
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
  - id: URS_HEALTH_AND_SAFETY
    pack: [urs]
    theme_id: URS-TIER_2-04    # sheet 7: URS has no construction or heavy machinery. Example: LA Metro platform strike
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
  - id: URS_CLIMATE_ADAPTATION
    pack: [urs]
    theme_id: URS-TIER_2-05
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
  - id: URS_STAFF_SAFETY_CONFLICT   # the urs counterpart of TW_PERSONNEL_DUTY_OF_CARE; no RED
    pack: [urs]
    theme_id: URS-EMERGING-01
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
  - id: URS_EMERGING_TECHNOLOGY
    pack: [urs]
    theme_id: URS-EMERGING-02  # examples: AI traffic management, a post-quantum call, EV charging and ADAS
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
  - id: URS_TALENT_SCARCITY
    pack: [urs]
    theme_id: URS-EMERGING-03  # management request 1: critical skills and visa changes, STE URS QFC Branch
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
  # urs: additions from workbook sheet 7 (drivers, the tier-2 rationale, and watchpoints). Trigger is keywords_any.
  - id: URS_TAIWAN_CONCENTRATION   # sheet 7, tier-2 risk 1: six prospective rail projects in Taiwan
    pack: [urs]
    theme_id: URS-TIER_2-01
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    keywords_any: [Taiwan concentration, Taiwan rail, rail projects in Taiwan]
  - id: URS_CHINESE_AFFILIATION_SCRUTINY   # sheet 7, key risk 5 driver
    pack: [urs]
    theme_id: URS-KEY-05
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    keywords_any: [Chinese affiliation, public sentiment]
  - id: URS_AI_ENABLED_ATTACK   # sheet 7, key risk 4 driver
    pack: [urs]
    theme_id: URS-KEY-04
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    keywords_any: [AI-enhanced, malicious attack, phishing]
  - id: URS_CONFLICT_SUPPLY_CHAIN   # sheet 7, section 5.1 watchpoints
    pack: [urs]
    theme_id: URS-EMERGING-01
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    keywords_any: [blockade, embargo, critical materials, alternative sourcing]
  - id: URS_TOLLING_TECHNOLOGY   # sheet 7, section 5.2 (TransCore). "Road user charging" comes from a real signal
    pack: [urs]
    theme_id: URS-EMERGING-02
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    keywords_any: [toll collection, RFID tolling, electronic toll, road user charging]
  - id: URS_AI_ADOPTION_GOVERNANCE   # sheet 7, sections 5.3 and 5.4
    pack: [urs]
    theme_id: URS-EMERGING-02
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    keywords_any: [Generative AI, edge computing, AI governance, responsible AI, predictive maintenance]
  - id: URS_TALENT_MARKET   # sheet 7, section 5.5 watchpoints
    pack: [urs]
    theme_id: URS-EMERGING-03
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    keywords_any: [talent demand, talent supply, hot skills, reskilling]
