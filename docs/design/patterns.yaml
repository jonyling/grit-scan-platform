version: 1
# DRAFT for review; no code loads this yet.
# Sources: condition ids and watchIndicators from config/urs-tw/URS-TW-Global-Baseline.json,
# theme ids from config/urs/URS-STE-Themes.json, titles from 268 GRIT_Signals rows (2026-10-01).
# Each pattern has a label (condition_id or theme_id) and one trigger. The trigger is keywords_any,
# else the triple fields (each *_any list holds on one hit), else the label theme's own keywords.
# theme_id and keywords_any are proposed additions to the bind doc's field set.
#   keywords_any: case-insensitive phrase in title or body; 6+ characters or multi-word.
# Triple triggers only fire on GDELT rows or accepted proposed triples.
# Currents and weekly text rows can only fire keyword and theme triggers.
# OPEN: with require_ste_link true, Trump-Xi coverage (about 51 of 268 rows) stays unbound.
patterns:
  # --- urs-tw: ten Layer 1 conditions. condition_id is the baseline id. ---
  - id: US_CN_TECH_RIVALRY
    pack: [urs-tw]
    condition_id: TW-GLOBAL-06
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    actors_any: [US, PRC, TW]
    rel_any: [restricts_export_to, sanctions]
    obj_any: [semiconductors, lithography, dual_use_ai]
    exclude_rel: []
  - id: TW_PERSONNEL_DUTY_OF_CARE
    pack: [urs-tw]
    condition_id: TW-GLOBAL-03   # closest baseline condition; evacuation guidance sits in TW-GLOBAL-10
    aperture: [DAILY, WEEKLY, RED]   # RED stays only if a named human approves it as pageable
    require_ste_link: true
    require_site_or_personnel: true
    actors_any: [PRC, PLA]
    rel_any: [military_action_toward]
    places_any: [TAIWAN]
  - id: TW_US_CN_COMPETITION
    pack: [urs-tw]
    condition_id: TW-GLOBAL-01
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    keywords_any: [US-China, Trump-Xi, trade truce, strategic competition]
  - id: TW_CHINA_TRAJECTORY
    pack: [urs-tw]
    condition_id: TW-GLOBAL-02
    aperture: [DAILY, WEEKLY]
    require_ste_link: true
    keywords_any: [Defense Mobilization, red-line, Taiwan-linked companies, civil-military]
  - id: TW_STRAIT_PRESSURE
    pack: [urs-tw]
    condition_id: TW-GLOBAL-03
    aperture: [DAILY, WEEKLY]
