version: 1
# Draft class and relation list for the ontology. No code loads this file; grit/ontology/graph.py follows it by hand
# and adds the relations part_of, buys_from and competes_in, and the class Theme. See ontology-bind.md.
descriptions:
  STE: ST Engineering, a business area, a unit, or a registered legal entity.
  LOB: A line of business that an STE entity operates in, such as Mobility Rail or Smart Sustainable Utilities.
  Customer: An organization that STE sells to.
  Supplier: An organization that STE buys from.
  Site: A project location or facility in the exposure register, such as a warehouse. A country of incorporation is not a site.
  State: A sovereign actor in an event.
  Org: A company or institution that is not on the STE register, such as a competitor.
  Policy: A policy or named instrument, such as the CHIPS Act, the Entity List, an export licence rule, or a travel ban.
  Good: A material under control or in the supply chain, such as lithography tools, rare earths, or dual-use AI chips.
  Place: A geography that is not a register site, such as the Taiwan Strait, Kaohsiung, Shenzhen, or a sea lane.
  Event: The incident a page reports, such as a licence denial, a drill, or a plant fire.
  ManagementRequest: An approved monitoring request from leadership or a LOB head (spec 29). It sets priority only and never links a page to STE on its own.
classes:
  - STE
  - LOB
  - Customer
  - Supplier
  - Site
  - State
  - Org
  - Policy
  - Good
  - Place
  - Event
  - ManagementRequest
relations:
  involves:
    from: [Event, Org, State]
    to: [STE, Customer, Supplier, Site, LOB]
  operates_in:
    from: [STE]
    to: [LOB]
  focuses_on:
    from: [ManagementRequest]
    to: [LOB, Place, Site]
  located_in:
    from: [STE, Customer, Supplier, Site, Org]
    to: [Place, Site]
  supplies:
    from: [Supplier, Org]
    to: [STE, Customer]
    obj: [Good]
  restricts_export_to:
    from: [State, Org]
    to: [State, Org]
    obj: [Good, Policy]
  sanctions:
    from: [State]
    to: [State, Org]
    obj: [Policy]
  military_action_toward:
    from: [State]
    to: [Place, State]
goods:
  - semiconductors
  - lithography
  - dual_use_ai
  - rare_earths