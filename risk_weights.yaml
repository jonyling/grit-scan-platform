version: 1
# DRAFT for review; no code loads this yet.
# Bands order results and search effort. They never decide whether a signal binds.
# A null is a missing fact for the owner to set; nothing here is a guessed number.
packs:
  urs:
    registers:
      - id: URS-STE-Themes
        file: config/urs/URS-STE-Themes.json
        scope: BA
        band: 1
        tier_order: [KEY, TIER_2, EMERGING]
      - id: STE-Risk-Universe
        file: config/STE-Risk-Universe.json
        scope: GROUP
        band: 2
        crosswalk: risk_crosswalk.yaml
        keywords_file: config/STE-Risk-Universe-Keywords.json   # to be created; the universe has no keywords
  urs-tw:
    registers:
      - id: URS-TW-STE-Annual-Risks
        file: config/urs-tw/URS-TW-STE-Annual-Risks.json
        scope: BA
        band: 1
        tier_order: [KEY_RISK, TIER2_RISK, EMERGING_RISK]
      - id: STE-Risk-Universe
        file: config/STE-Risk-Universe.json
        scope: GROUP
        band: 2
        crosswalk: risk_crosswalk.yaml
        keywords_file: config/STE-Risk-Universe-Keywords.json
# Later: Commercial Aerospace and DSC each add a pack with their own band 1 register.
search:
  band_1: {cadence: every_run, max_queries_per_run: null}
  band_2: {cadence: null, max_queries_per_run: null}
# A signal that hits a BA theme and a mapped Group risk counts once, in band 1.
overlap: BEST_BAND_WINS
